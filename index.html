<script>
(() => {
// ================= layout (art pixels) =================
const COLS = 11, ROWS = 17, CELL = 16;
const FW = COLS * CELL, FH = ROWS * CELL;      // dance floor 176 x 272
const WALLH = 56, HUDH = 26, GAP = 2;
const ROOMH = HUDH + GAP + WALLH + FH + 4;
const BEAT = 240;                                // ms per beat
const INK = '#140b22', BG = '#120a1e';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// keyboard: the canvas takes focus so keys reach the game (also inside an embedded frame)
cv.tabIndex = 0;
const grabFocus = () => { try { cv.focus({preventScroll: true}); } catch (e) {} try { window.focus(); } catch (e) {} };
let kb = false;   // show key hints instead of swipe hints
try { kb = typeof matchMedia === 'function' && matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) {}
const hint = (touch, keys) => kb ? keys : touch;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let DW, DH, P, BW, BH, FX, FY, buf, b, bgc, DPR = 1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3); DPR = dpr;
  const W = innerWidth, H = innerHeight;
  DW = Math.max(1, Math.round(W * dpr)); DH = Math.max(1, Math.round(H * dpr));
  cv.width = DW; cv.height = DH; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const raw = Math.min(DW / (FW + 10), DH / (ROOMH + 8));
  P = raw >= 3 ? Math.floor(raw) : Math.max(1, raw);   // whole-pixel scaling when there's room
  BW = Math.ceil(DW / P); BH = Math.ceil(DH / P);
  buf = mk(BW, BH); b = buf.getContext('2d');
  FX = Math.floor((BW - FW) / 2);
  FY = Math.floor((BH - ROOMH) / 2) + HUDH + GAP + WALLH;
  bgc = mk(BW, BH);
  const g = bgc.getContext('2d');
  g.fillStyle = BG; g.fillRect(0, 0, BW, BH);
  g.fillStyle = '#1e1233';
  for (let y = 2; y < BH; y += 9) for (let x = (y % 18 ? 6 : 1); x < BW; x += 10) g.fillRect(x, y, 1, 1);
}
addEventListener('resize', resize);
resize();

// ================= palette & data =================
const SHIRTS = ['#ff4d6d','#3bceac','#4cc9f0','#b388ff','#ff8c42','#7bd389','#f72585','#f4f1ff','#ffd23f'];
const SKINS = ['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524'];
const HAIR = ['#2b1d12','#6b3e26','#e8c66a','#d9541e','#bdb8c8','#2a2a35','#ff6fa8'];

const SHOES = ['#f4f1ff','#ff4d6d','#1e1e2e','#ffd23f','#4cc9f0'];
const BULBS = ['#ff4d6d','#ffd23f','#3bceac','#4cc9f0','#b388ff','#ff8c42'];
const LIT = [['#7a1f6e','#c23a9a'],['#1f5a7a','#3a96c8'],['#7a5a1f','#c8962f'],['#3d2f8a','#6a56d4'],['#1f7a5a','#36c08f']];
const NAMES = ['Brenda','Gary','Doug','Linda','Kevin','Trish','Marco','Deb','Steve','Rosa','Phil','Tina','Raj','Carla','Hank','Yuki','Bob','Lupe','Ned','Pam','Uncle Ray','Aunt Sue','Chad','Gloria'];
const LEAVE_LINES = ['brb!','gotta pee','nature calls','hold my spot','2 sec!','too much punch','SORRY','be right back','keep going w/o me','not again'];
const BACK_LINES = ['I\'m back!','what\'d I miss','ok ok ok','let me in!','wash ur hands? yes'];
const TABLE_LINES = ['my feet hurt','nacho break!','ooh, cake','need a breather','gotta sit'];
const BAR_LINES = ['ooh, margaritas!','free shots?!','just one drink','brb, thirsty','TEQUILA!'];
const JOIN_LINES = ['my song!','wait for me!','I\'m in!','conga time!','save me a spot!'];
const TIPSY_LINES = ['HIC!','i love you guys','whooo!','who moved the floor','i\'m fine. hic'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, c) => a + Math.random() * (c - a);
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
  const m = v => Math.max(0, Math.min(255, Math.round(f < 1 ? v * f : v + (255 - v) * (f - 1))));
  return '#' + ((1 << 24) | (m(ch[0]) << 16) | (m(ch[1]) << 8) | m(ch[2])).toString(16).slice(1);
}
const BULBS_D = BULBS.map(c => shade(c, 0.35));
let gid = 0;
function guest() {
  const shirt = pick(SHIRTS), skin = pick(SKINS);
  return { id: ++gid, shirt, shirtD: shade(shirt, 0.72), skin, skinD: shade(skin, 0.86), hair: pick(HAIR),
    pants: pick(PANTS), shoe: pick(SHOES), hs: Math.floor(Math.random() * 6), acc: Math.floor(Math.random() * 4),
    name: pick(NAMES), dx: 0, dy: 0 };
}

// ================= pixel font (5x7) =================
const FONT = {
A:['.XXX.','X...X','X...X','XXXXX','X...X','X...X','X...X'],B:['XXXX.','X...X','X...X','XXXX.','X...X','X...X','XXXX.'],
C:['.XXX.','X...X','X....','X....','X....','X...X','.XXX.'],D:['XXXX.','X...X','X...X','X...X','X...X','X...X','XXXX.'],
E:['XXXXX','X....','X....','XXXX.','X....','X....','XXXXX'],F:['XXXXX','X....','X....','XXXX.','X....','X....','X....'],
G:['.XXX.','X...X','X....','X.XXX','X...X','X...X','.XXXX'],H:['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'],
I:['XXX','.X.','.X.','.X.','.X.','.X.','XXX'],J:['..XXX','...X.','...X.','...X.','...X.','X..X.','.XX..'],
K:['X...X','X..X.','X.X..','XX...','X.X..','X..X.','X...X'],L:['X....','X....','X....','X....','X....','X....','XXXXX'],
M:['X...X','XX.XX','X.X.X','X.X.X','X...X','X...X','X...X'],N:['X...X','X...X','XX..X','X.X.X','X..XX','X...X','X...X'],
O:['.XXX.','X...X','X...X','X...X','X...X','X...X','.XXX.'],P:['XXXX.','X...X','X...X','XXXX.','X....','X....','X....'],
Q:['.XXX.','X...X','X...X','X...X','X.X.X','X..X.','.XX.X'],R:['XXXX.','X...X','X...X','XXXX.','X.X..','X..X.','X...X'],
S:['.XXXX','X....','X....','.XXX.','....X','....X','XXXX.'],T:['XXXXX','..X..','..X..','..X..','..X..','..X..','..X..'],
U:['X...X','X...X','X...X','X...X','X...X','X...X','.XXX.'],V:['X...X','X...X','X...X','X...X','X...X','.X.X.','..X..'],
W:['X...X','X...X','X...X','X.X.X','X.X.X','XX.XX','X...X'],X:['X...X','X...X','.X.X.','..X..','.X.X.','X...X','X...X'],
Y:['X...X','X...X','.X.X.','..X..','..X..','..X..','..X..'],Z:['XXXXX','....X','...X.','..X..','.X...','X....','XXXXX'],
'0':['.XXX.','X...X','X..XX','X.X.X','XX..X','X...X','.XXX.'],'1':['.X.','XX.','.X.','.X.','.X.','.X.','XXX'],
'2':['.XXX.','X...X','....X','...X.','..X..','.X...','XXXXX'],'3':['XXXX.','....X','....X','.XXX.','....X','....X','XXXX.'],
'4':['...X.','..XX.','.X.X.','X..X.','XXXXX','...X.','...X.'],'5':['XXXXX','X....','XXXX.','....X','....X','X...X','.XXX.'],
'6':['..XX.','.X...','X....','XXXX.','X...X','X...X','.XXX.'],'7':['XXXXX','....X','...X.','..X..','.X...','.X...','.X...'],
'8':['.XXX.','X...X','X...X','.XXX.','X...X','X...X','.XXX.'],'9':['.XXX.','X...X','X...X','.XXXX','....X','...X.','.XX..'],
'!':['X','X','X','X','X','.','X'],'?':['.XXX.','X...X','....X','...X.','..X..','.....','..X..'],
'.':['.','.','.','.','.','.','X'],',':['..','..','..','..','..','.X','X.'],"'":['X','X','.','.','.','.','.'],
'+':['.....','..X..','..X..','XXXXX','..X..','..X..','.....'],'-':['....','....','....','XXXX','....','....','....'],
'/':['....X','...X.','...X.','..X..','.X...','.X...','X....'],':':['.','X','.','.','.','X','.'],
' ':['...','...','...','...','...','...','...'],
'♪':['..X..','..XX.','..X.X','..X..','XXX..','XXX..','.....'],'♫':['.XXXX','.X..X','.X..X','.X..X','XX.XX','XX.XX','.....'],
};
const GRADS = {
  warm: ['#fff6b8','#ffe066','#ffd23f','#ffb13b','#ff8c42','#ff6b4a','#f7556d'],
  cool: ['#d9fdff','#8ff0ff','#4cc9f0','#4cc9f0','#7b8cff','#9b6bff','#b388ff'],
  pinkg: ['#ffd1e0','#ff9cc0','#ff6ba0','#ff4d8d','#f72585','#d61a72','#b0105a'],
};
const glyph = ch => FONT[ch] || FONT['?'];
function textW(s, sc = 1) { let w = 0; for (const ch of s) w += glyph(ch)[0].length + 1; return Math.max(0, w - 1) * sc; }
function outlined(src) {
  const w = src.width, h = src.height, o = mk(w, h), og = o.getContext('2d'), sil = mk(w, h), sg = sil.getContext('2d');
  sg.drawImage(src, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = INK; sg.fillRect(0, 0, w, h);
  og.drawImage(sil, -1, 0); og.drawImage(sil, 1, 0); og.drawImage(sil, 0, -1); og.drawImage(sil, 0, 1); og.drawImage(src, 0, 0);
  return o;
}
const tcache = new Map();
function textImg(s, col, sc, ol) {
  const key = s + '|' + col + '|' + sc + '|' + ol;
  let c = tcache.get(key); if (c) return c;
  if (tcache.size > 500) tcache.clear();
  const t = mk(textW(s, sc) + 2, 7 * sc + 2), g = t.getContext('2d'), grad = GRADS[col];
  let x = 1;
  for (const ch of s) {
    const gl = glyph(ch);
    for (let r = 0; r < 7; r++) {
      g.fillStyle = grad ? grad[r] : col;
      for (let k = 0; k < gl[r].length; k++) if (gl[r][k] === 'X') g.fillRect(x + k * sc, 1 + r * sc, sc, sc);
    }
    x += (gl[0].length + 1) * sc;
  }
  c = ol ? outlined(t) : t;
  tcache.set(key, c); return c;
}
// x,y = top-left of the letters (al: 'c' centre, 'r' right edge)
function text(s, x, y, col, o = {}) {
  s = String(s).toUpperCase();
  const sc = o.sc || 1, img = textImg(s, col, sc, o.ol !== false), w = textW(s, sc);
  let left = x; if (o.al === 'c') left = x - Math.floor(w / 2); else if (o.al === 'r') left = x - w + 1;
  b.drawImage(img, Math.round(left) - 1, Math.round(y) - 1);
}
function wrap(s, maxW) {
  const out = []; let line = '';
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (textW(t) > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}

// ================= drawing primitives =================
function R(x, y, w, h, c) { b.fillStyle = c; b.fillRect(x, y, w, h); }
function disc(cx, cy, r, c, sq = 1) {
  b.fillStyle = c;
  const ry = Math.max(1, Math.round(r * sq));
  for (let yy = -ry; yy <= ry; yy++) {
    const k = yy / (ry + 0.5), w = Math.floor((r + 0.4) * Math.sqrt(Math.max(0, 1 - k * k)));
    b.fillRect(Math.round(cx - w), Math.round(cy + yy), w * 2 + 1, 1);
  }
}

// ================= dancer sprites =================
const SW = 28, SH = 40, AX = 14, AY = 36;
const BLUSH = '#ff8fa3';
const scache = new Map();
function hat(R2, top, c1, c2, pom, tall) {
  const ws = tall ? [6, 6, 4, 4, 4, 2, 2, 2] : [6, 4, 4, 2, 2];
  ws.forEach((w, i) => R2(-w / 2, top - 1 - i, w, 1, (i >> 1) & 1 ? c2 : c1));
  R2(-1, top - 2 - ws.length, 2, 2, pom);
}
function paint(s, g, face, mode, f, kick) {
  const R2 = (x, y, w, h, c) => { s.fillStyle = c; s.fillRect(AX + x, AY + y, w, h); };
  const side = face === 'left' || face === 'right', sd = face === 'left' ? -1 : 1;
  const moving = mode === 'walk' || mode === 'urgent';
  const by = (mode === 'shock') ? 0 : -(f & 1);
  // ---- legs
  const leg = (x, lift) => { R2(x, -5 - lift, 2, 4, g.pants); R2(x, -1 - lift, 2, 1, g.shoe); };
  if (side) {
    const st = (moving || mode === 'dance') && (f & 1) ? 2 : 0;
    leg(-1 - st, 0); leg(-1 + st, 0);
  } else {
    let lx = -3, rx = 1, ll = 0, rl = 0;
    if (mode === 'urgent') { lx = -2; rx = 0; }
    if (moving) { if (f & 1) ll = 1; else rl = 1; }
    if ((mode === 'dance' || mode === 'idle') && f === 1) { if (kick < 0) ll = 1; else rl = 1; }
    if (mode === 'dance' && f === 3) {
      if (kick < 0) { R2(-5, -6, 2, 2, g.pants); R2(-7, -5, 2, 2, g.pants); R2(-9, -4, 2, 1, g.shoe); leg(rx, 0); }
      else { R2(3, -6, 2, 2, g.pants); R2(5, -5, 2, 2, g.pants); R2(7, -4, 2, 1, g.shoe); leg(lx, 0); }
    } else { leg(lx, ll); leg(rx, rl); }
  }
  // ---- torso
  const ty = -11 + by;
  R2(-4, ty, 8, 6, g.shirt); R2(side && sd > 0 ? -4 : 3, ty, 1, 6, g.shirtD); R2(-4, ty + 5, 8, 1, g.shirtD);
  if (g.acc === 3 && !g.leader && face === 'down') { R2(-3, ty + 1, 1, 1, '#ff4d6d'); R2(-2, ty + 2, 1, 1, '#ffd23f'); R2(-1, ty + 2, 2, 1, '#7bd389'); R2(1, ty + 2, 1, 1, '#ffd23f'); R2(2, ty + 1, 1, 1, '#4cc9f0'); }
  if (g.leader && face === 'down') { R2(-1, ty + 1, 2, 3, '#f72585'); }
  // ---- arms
  const maraca = (x, y) => { R2(x, y, 2, 3, '#ff8c42'); R2(x, y, 1, 1, '#ffd23f'); };
  const sl = x => R2(x, ty, 2, 2, g.shirt);
  const aUp = x => { R2(x, ty - 3, 2, 3, g.skin); sl(x); if (g.leader) maraca(x, ty - 6); };
  const aOut = (x, o) => { sl(x); R2(x + o * 2, ty - 1, 2, 2, g.skin); if (g.leader) maraca(x + o * 2, ty - 4); };
  const aDown = (x, sw = 0) => { sl(x); R2(x, ty + 2 + sw, 2, 2, g.skin); };
  const LX = -6, RX = 4;
  if (side) {
    const ax = -1;
    if (mode === 'dance' && !g.leader) R2(ax, ty + 1, 2, 2, g.shirtD);
    else if (mode === 'shock' || g.leader && mode === 'dance') { R2(ax, ty - 4, 2, 4, g.skin); R2(ax, ty, 2, 2, g.shirtD); if (g.leader) maraca(ax, ty - 7 - (f & 1)); }
    else if (mode === 'urgent') { R2(ax, ty + 1, 2, 2, g.shirtD); R2(ax + sd, ty + 3, 2, 2, g.skin); }
    else { const sw = moving ? ((f & 1) ? 1 : -1) * sd : 0; R2(ax + sw, ty + 1, 2, 2, g.shirtD); R2(ax + sw * 2, ty + 3, 2, 2, g.skin); }
  } else if (mode === 'dance') {
    if (g.leader) { if (f & 1) { aUp(LX); aOut(RX, 1); } else { aOut(LX, -1); aUp(RX); } }
    else { sl(LX); sl(RX); }
  } else if (mode === 'idle') { aDown(RX); if (f & 1) aUp(LX); else aOut(LX, -1); }
  else if (mode === 'shock') { aUp(LX); aUp(RX); }
  else if (mode === 'urgent' && face === 'down') { sl(LX + 1); sl(RX - 1); R2(-2, ty + 4, 4, 2, g.skin); }
  else { const sw = moving ? (f & 1) : 0; aDown(LX, sw); aDown(RX, 1 - sw - (moving ? 0 : 1)); }
  // ---- head
  const hy = -19 + by, H = g.hair, hs = g.hs;
  R2(-4, hy, 8, 8, g.skin);
  if (side) R2(sd > 0 ? -4 : 3, hy + 2, 1, 6, g.skinD);
  if (face === 'down') {
    if (mode === 'shock') { R2(-3, hy + 3, 2, 2, '#fff'); R2(1, hy + 3, 2, 2, '#fff'); R2(-2, hy + 4, 1, 1, INK); R2(1, hy + 4, 1, 1, INK); R2(-1, hy + 6, 2, 2, INK); }
    else if (mode === 'urgent') { R2(-3, hy + 4, 2, 1, INK); R2(1, hy + 4, 2, 1, INK); R2(-2, hy + 6, 1, 1, INK); R2(-1, hy + 7, 2, 1, INK); R2(1, hy + 6, 1, 1, INK); }
    else { R2(-2, hy + 3, 1, 2, INK); R2(1, hy + 3, 1, 2, INK); R2(-3, hy + 5, 1, 1, BLUSH); R2(2, hy + 5, 1, 1, BLUSH); R2(-1, hy + 6, 2, 1, '#8a2338'); }
  } else if (side) {
    const ex = sd > 0 ? 1 : -2;
    if (mode === 'urgent') R2(ex, hy + 4, 2, 1, INK);
    else if (mode === 'shock') { R2(ex, hy + 3, 2, 2, '#fff'); R2(ex + (sd > 0 ? 1 : 0), hy + 4, 1, 1, INK); }
    else R2(ex + (sd > 0 ? 1 : 0), hy + 3, 1, 2, INK);
    R2(sd > 0 ? 4 : -5, hy + 4, 1, 2, g.skin);
    if (mode !== 'urgent') R2(sd > 0 ? 2 : -3, hy + 5, 1, 1, BLUSH);
  }
  if (face === 'down') {
    if (hs === 0) { R2(-4, hy, 8, 2, H); R2(-4, hy + 2, 1, 2, H); R2(3, hy + 2, 1, 2, H); }
    if (hs === 1) { R2(-4, hy - 1, 8, 3, H); R2(-5, hy, 2, 9, H); R2(3, hy, 2, 9, H); }
    if (hs === 2) { R2(-4, hy, 8, 2, H); R2(-4, hy + 2, 1, 1, H); R2(3, hy + 2, 1, 1, H); R2(-2, hy - 3, 4, 3, H); }
    if (hs === 3) { R2(-5, hy - 4, 10, 1, H); R2(-6, hy - 3, 12, 5, H); R2(-6, hy + 2, 2, 3, H); R2(4, hy + 2, 2, 3, H); }
    if (hs === 4) { R2(-4, hy, 8, 1, H); R2(-4, hy + 1, 1, 1, H); R2(3, hy + 1, 1, 1, H); }
    if (hs === 5) { R2(-4, hy, 8, 2, H); R2(-3, hy - 2, 2, 2, H); R2(1, hy - 2, 2, 2, H); R2(-1, hy - 3, 2, 3, H); }
  } else if (face === 'up') {
    R2(-4, hy, 8, 7, H);
    if (hs === 1) R2(-5, hy, 10, 10, H);
    if (hs === 2) R2(-2, hy - 3, 4, 3, H);
    if (hs === 3) { R2(-6, hy - 3, 12, 9, H); R2(-5, hy - 4, 10, 1, H); }
    if (hs === 5) { R2(-3, hy - 2, 2, 2, H); R2(1, hy - 2, 2, 2, H); R2(-1, hy - 3, 2, 3, H); }
  } else {
    R2(-4, hy, 8, 2, H); R2(sd > 0 ? -4 : 1, hy + 2, 3, 4, H);
    if (hs === 1) R2(sd > 0 ? -5 : 2, hy + 1, 4, 9, H);
    if (hs === 2) R2(sd > 0 ? -7 : 4, hy, 3, 3, H);
    if (hs === 3) { R2(-6, hy - 3, 12, 5, H); R2(sd > 0 ? -6 : 2, hy + 2, 4, 4, H); }
    if (hs === 5) { R2(-2, hy - 2, 2, 2, H); R2(1, hy - 3, 2, 3, H); }
  }
  // ---- accessories
  const top = hy - (hs === 3 ? 4 : hs === 2 || hs === 5 ? 3 : hs === 1 ? 1 : 0);

function updateWalkers(dt) {
  const sp = CELL * 3.2 * dt / 1000;
  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];
    w.t += dt; w.bt -= dt;
    if (w.phase === 'toBar' || w.phase === 'toSeat') {
      const tx = w.phase === 'toBar' ? fxC(w.bx) : fxC(w.tx), ty = w.phase === 'toBar' ? BARFEET : fyC(w.ty);
      const dx = tx - w.px, dy = ty - w.py, d = Math.hypot(dx, dy);
      if (d > 0.5) { w.vx = dx / d; w.vy = dy / d; }
      if (d > sp) { w.px += dx / d * sp; w.py += dy / d * sp; continue; }
      w.px = tx; w.py = ty;
      if (w.phase === 'toBar') { w.phase = 'drinking'; w.timer = rand(2500, 4000); continue; }
      w.phase = 'seated'; w.timer = rand(3000, 6000); w.vx = 0; w.vy = 1;
    } else if (w.phase === 'seated') {
      w.timer -= dt;
      if (w.timer <= 0) {
        const c = emptyCell();
        if (c) { w.phase = 'back'; w.tx = c.x; w.ty = c.y; w.bubble = pick(w.fresh ? JOIN_LINES : BACK_LINES); w.bt = 1600; }
        else w.timer = 600;
      }
    } else if (w.phase === 'drinking') {
      w.timer -= dt;
      if (w.timer <= 0) {
        const c = emptyCell();
        if (c) { w.phase = 'back'; w.tipsy = true; w.tx = c.x; w.ty = c.y; w.bubble = pick(TIPSY_LINES); w.bt = 1800; play('hic'); }
        else w.timer = 800;
      }
    } else if (w.phase === 'out' || w.phase === 'back') {
      const tx = w.phase === 'out' ? DOOR.x : fxC(w.tx), ty = w.phase === 'out' ? DOOR.y : fyC(w.ty);
      const dx = tx - w.px, dy = ty - w.py, d = Math.hypot(dx, dy);
      if (d > 0.5) { w.vx = dx / d; w.vy = dy / d; }
      if (d <= sp) {
        w.px = tx; w.py = ty;
        if (w.phase === 'out') { w.phase = 'inside'; w.timer = rand(4000, 8000); doorT = 450; play('door'); }
        else {
          if (taken(w.tx, w.ty)) { w.tx = -9; const c = emptyCell(); if (c) { w.tx = c.x; w.ty = c.y; } continue; }
          w.g.dx = tx; w.g.dy = ty;
          waiting.push({x: w.tx, y: w.ty, g: w.g, returnee: !w.fresh, born: now, tipsy: !!w.tipsy, next: now + 1800, say: w.tipsy ? 'HIC!' : null});
          walkers.splice(i, 1);
        }
      } else {
        w.px += dx / d * sp; w.py += dy / d * sp;
        if (w.phase === 'out' && Math.random() < dt / 260) drops(w.px, w.py - 20, 1);
      }
    } else if (w.phase === 'inside') {
      w.timer -= dt;
      if (w.timer <= 0) {
        const c = emptyCell();
        if (c) {
          w.phase = 'back'; w.tx = c.x; w.ty = c.y; w.px = DOOR.x; w.py = DOOR.y; w.bubble = pick(BACK_LINES); w.bt = 1800; doorT = 500;
          pop(DOOR.x, -46, 'FLUSH!', '#8fe3ff', 1100); drops(DOOR.x, -12, 8); play('flush');
        } else w.timer = 1000;
      }
    }
  }
}

// dancers glide between cells; anyone far from their spot runs there
function updateLine(dt) {

// attract-mode pilot for the title screen
function flood(sx, sy, body, cap) {
  const seen = new Set([sx + ',' + sy]), q = [[sx, sy]];
  while (q.length && seen.size < cap) {
    const [x, y] = q.shift();
    for (const [ax, ay] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + ax, ny = y + ay, k = nx + ',' + ny;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || body.has(k) || seen.has(k)) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return seen.size;
}
// point the leader at the most open stretch of floor (not at a wall, table, the bar or the line)
function safeHeading() {
  const h = path[0], neck = path[1];
  const body = new Set(path.slice(0, path.length - 1).map(p => p.x + ',' + p.y));
  TABLES.forEach(t => body.add(t.x + ',' + t.y)); for (let x = BAR.x0; x <= BAR.x1; x++) body.add(x + ',' + BAR.y);
  const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !body.has(x + ',' + y);
  let best = null, bestS = -1e9;
  for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
    const nx = h.x + dx, ny = h.y + dy;
    if (neck && neck.x === nx && neck.y === ny) continue;
    if (!free(nx, ny)) continue;
    let run = 0; while (run < 6 && free(h.x + dx * (run + 1), h.y + dy * (run + 1))) run++;
    let sc = run * 100 + Math.min(flood(nx, ny, body, 60), 60) + (dx === dir.x && dy === dir.y ? 5 : 0);
    if (nearBar(nx, ny)) sc -= 250;
    if (sc > bestS) { bestS = sc; best = {x: dx, y: dy}; }
  }
  if (best) dir = best;
}
function autopilot() {
  const h = path[0];
  const body = new Set(path.slice(0, path.length - 1).map(p => p.x + ',' + p.y));
  TABLES.forEach(t => body.add(t.x + ',' + t.y)); for (let x = BAR.x0; x <= BAR.x1; x++) body.add(x + ',' + BAR.y);
  let tgt = null, td = 1e9;
  waiting.forEach(w => { const d = Math.abs(w.x - h.x) + Math.abs(w.y - h.y); if (d < td) { td = d; tgt = w; } });
  let bestD = null, bestS = -1e9;
  for (const d of [dir, {x: dir.y, y: -dir.x}, {x: -dir.y, y: dir.x}]) {
    const nx = h.x + d.x, ny = h.y + d.y;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || body.has(nx + ',' + ny)) continue;
    let s = Math.min(flood(nx, ny, body, 80), path.length + 6) * 10 + (d === dir ? 0.5 : 0) + Math.random() * 0.4;
    if (tgt) s -= Math.abs(tgt.x - nx) + Math.abs(tgt.y - ny);
    if (s > bestS) { bestS = s; bestD = d; }
  }
  if (bestD) dir = bestD;
}

const ARROW = ['.....X.....', '....XXX....', '...XXXXX...', '..XXXXXXX..', '.XXXXXXXXX.', 'XXXXXXXXXXX', '...XXXXX...', '...XXXXX...', '...XXXXX...', '...XXXXX...', '...XXXXX...'];

}
function tapStart() {
  if (state === 'title' || (state === 'over' && now - overAt > 700)) { audioInit(); state = 'play'; reset(); sfx.tick(); }
}
let sx = 0, sy = 0, down = false, swiped = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); grabFocus(); audioInit();
  if (e.pointerType === 'touch') kb = false;
  if (hitMute(e.clientX, e.clientY)) { setMuted(!muted); down = false; return; }
  down = true; swiped = false; sx = e.clientX; sy = e.clientY;
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.hypot(dx, dy) > 22 && !(dance && swiped)) {
    if (Math.abs(dx) > Math.abs(dy)) pushDir(Math.sign(dx), 0); else pushDir(0, Math.sign(dy));
    sx = e.clientX; sy = e.clientY; swiped = true;
  }
});
addEventListener('pointerup', () => { if (down && !swiped) tapStart(); down = false; });
const KEYDIR = {arrowup: [0, -1], w: [0, -1], keyw: [0, -1], arrowdown: [0, 1], s: [0, 1], keys: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0], keya: [-1, 0], arrowright: [1, 0], d: [1, 0], keyd: [1, 0]};
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = (e.key || '').toLowerCase(), c = (e.code || '').toLowerCase();
  const d = KEYDIR[k] || KEYDIR[c];
  kb = true;
  if (d || k === ' ' || c === 'space' || k === 'enter') e.preventDefault();   // keep arrows and space from scrolling the page
  if (d) { if (!(e.repeat && dance)) pushDir(d[0], d[1]); return; }
  if (e.repeat) return;
  if (k === ' ' || c === 'space' || k === 'enter') {
    if (state === 'play' && startT > 300 && !dance) startT = 1;   // skip the countdown
    else tapStart();
  } else if (k === 'm' || c === 'keym') { audioInit(); setMuted(!muted); }
});
addEventListener('load', grabFocus);
grabFocus();

// ================= loop =================
reset();
let last = performance.now();
function loop(ts) {
  const dt = Math.max(0, Math.min(50, ts - last)); last = ts; now += dt;
  const nb = Math.floor(now / BEAT);
  if (nb !== beat) { beat = nb; onBeat(beat); }
  if (state === 'play' || state === 'title') {
    const demo = state === 'title';
    if (!demo && startT > 0) {
      const was = startT; startT -= dt; acc = 0;
      if (Math.floor(was / 550) !== Math.floor(Math.max(0, startT) / 550) && startT > 0) play('tick');
      if (startT <= 0) { startT = 0; pop(88, 120, 'GO!', '#3bceac', 700, 3); play('start'); }
    }
    else if (dance) { acc = 0; nextLeave = Math.max(nextLeave, now + 3000); barCool = Math.max(barCool, now + 2000); updateDance(); }
    else acc += dt;
    while (acc >= curStep() && (state === 'play' || state === 'title')) { acc -= curStep(); if (demo) autopilot(); step(); }
    if (power && power.kind !== 'dance' && now - power.t0 > power.dur) power = null;
    if (state !== 'over' && now >= nextLeave) {
      leave();
      nextLeave = now + Math.max(2500, 8000 - guests.length * 250) + rand(0, 2500);
    }
    if (state !== 'over' && !waiting.some(w => !w.returnee) && !walkers.some(w => w.fresh) && Math.random() < dt / 500) spawnWaiting();
    if (state !== 'over' && Math.random() < dt / 260 && guests.length) { const g = pick(guests); addNote(g.dx, g.dy - 24); }
    if (Math.random() < dt / 900) addNote(57, -30);
  }
  updateWalkers(dt);
  updateLine(dt);
  updateWaiting(dt);
  updateParts(dt);
  barTalk = Math.max(0, barTalk - dt);
  doorT = Math.max(0, doorT - dt); scorePulse = Math.max(0, scorePulse - dt); flashT = Math.max(0, flashT - dt);
  shake = Math.max(0, shake - dt * 0.012);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
